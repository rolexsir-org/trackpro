name: CI

# Quality gates for Track Pro. Every gate here is the real command a release
# engineer would run locally (docs/RELEASE.md documents the same sequence).
#
# Signing: release builds in CI are deliberately UNSIGNED-for-Play (they fall
# back to the debug key, see android/app/build.gradle.kts). No keystore or
# password ever enters CI. The Play upload artifact is built locally with
# android/key.properties per docs/RELEASE.md.

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze, test, release build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: flutter pub get
        run: flutter pub get

      - name: Code generation is up to date (drift)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --exit-code --stat -- lib/data/db/database.g.dart; then
            echo "::error::lib/data/db/database.g.dart is stale — run 'dart run build_runner build --delete-conflicting-outputs' and commit."
            exit 1
          fi

      - name: dart format (hand-written sources)
        run: |
          # Generated files (*.g.dart) are formatted by the generator, not by us.
          git ls-files '*.dart' ':!:*.g.dart' | xargs dart format --output=none --set-exit-if-changed

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: flutter build apk --release
        run: flutter build apk --release

      - name: flutter build appbundle --release
        run: flutter build appbundle --release

      - name: Verify release artifacts (identity, version, signing)
        run: |
          set -x
          ls -la build/app/outputs/flutter-apk/ build/app/outputs/bundle/release/
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/aapt2" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -E "^package|sdkVersion|targetSdkVersion|application-label"
          "$BT/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk
          # Native libraries must include 64-bit (Play requirement).
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -E "lib/(arm64-v8a|armeabi-v7a|x86_64)/" | head
          # AAB signing cert (debug fallback in CI is expected; Play upload uses the local keystore).
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | head -20 || true

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
