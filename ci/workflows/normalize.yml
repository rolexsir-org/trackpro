name: Normalize (format + codegen)

# Manually dispatched maintenance job: runs the drift code generator and
# dart format, and commits the result back to the branch it was dispatched on.
# Exists because formatting/codegen must come from the real toolchain, not be
# hand-edited. It never touches anything else and never force-pushes.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the stable release this repository was upgraded and
          # verified against (2026-10-20; see docs/UPGRADE_2026-10-20.md).
          # `channel: stable` alone would silently move the verification
          # target on the next Flutter release.
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Resolve dependencies (refresh lock if the SDK requires it)
        run: |
          flutter --version
          flutter pub get || flutter pub upgrade

      - name: Regenerate drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format hand-written sources
        run: git ls-files '*.dart' ':!:*.g.dart' | xargs dart format

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to normalize."
          else
            # [skip ci]: a formatting-only commit pushed by a bot should not spend 60
          # minutes of runner re-gating itself. Everything that matters about it is that
          # the *next* human push sees a tree that is already normal.
          git commit -m "chore: dart format + regenerate drift code (toolchain-run via CI) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
