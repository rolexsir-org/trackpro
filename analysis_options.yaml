include: package:flutter_lints/flutter.yaml

# The codebase is written to a 120-column budget (see the long doc comments in
# lib/). This keeps `dart format` from reflowing every file to 80 columns and
# makes `dart format --set-exit-if-changed .` a meaningful CI gate.
formatter:
  page_width: 120

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.drift.dart"
    - build/**
    - linux/**
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Drift generates a lot of code; keep its warnings out of the app's budget.
    unused_element: warning

linter:
  rules:
    - prefer_single_quotes
    - unawaited_futures
    - avoid_print
    - require_trailing_commas
