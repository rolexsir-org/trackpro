org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=false

# --- AGP 9 Kotlin opt-out (temporary; remove as one change) -------------------
# AGP 9 enables built-in Kotlin and the new DSL by default; Flutter 3.47's
# template explicitly opts out of both until every plugin in the tree has migrated
# off the Kotlin Gradle Plugin. Removing these two lines is the built-in-Kotlin
# migration, not a cleanup — do it only with that work (see
# docs/UPGRADE_2026-10-20.md §2 and §8).
#
# Two independent blockers keep the opt-out in place as of 2026-10-21:
#   1. `health` 13.3.2 (android/build.gradle) still applies
#      `apply plugin: 'kotlin-android'` unconditionally, so
#      `android.builtInKotlin=true` fails configuration at :health.
#   2. Flutter 3.47.7's Gradle plugin rejects the Kotlin version that AGP 9.1.0
#      bundles ("Your project's Kotlin version (2.2.10) is lower than Flutter's
#      minimum supported version of 2.2.20", flutter/flutter#192167); the skip
#      landed after 3.47 (flutter/flutter#192206).
android.builtInKotlin=false
android.newDsl=false

# With the opt-out active the Flutter Gradle plugin applies `kotlin-android` to
# :app, and KGP 2.3+ reports that as "Deprecated 'org.jetbrains.kotlin.android'
# plugin usage" in build/reports/problems/problems-report.html. It cannot be
# resolved by migrating yet (see above), so suppress that one diagnostic id —
# the same id AndroidX suppresses in its own gradle.properties. The AGP option
# warnings for the two flags above are deliberately NOT suppressed: they are
# the AGP 10 removal deadline and should stay visible. Remove this line
# together with the two flags, never before.
kotlin.suppressGradlePluginWarnings=DeprecatedKotlinAndroidPlugin
