org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=false
# AGP 9 enables built-in Kotlin and the new DSL by default; Flutter 3.47's
# template explicitly opts both out until every plugin has migrated off the
# Kotlin Gradle Plugin. Removing these two lines is the built-in-Kotlin
# migration, not a cleanup — do it only with that work (see
# docs/UPGRADE_2026-10-20.md).
android.builtInKotlin=false
android.newDsl=false
